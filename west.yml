manifest:
  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
    - name: pytorch
      url-base: https://github.com/pytorch

  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: v4.4.0
      import:
        name-allowlist:
          - hal_rpi_pico
          - cmsis
          - cmsis_6
          - cmsis-nn

    - name: executorch
      remote: pytorch
      revision: v1.5.1
      path: modules/lib/executorch
      submodules: true

  self:
    path: executorch-zephyr-arducam-pico4ML-BLE
