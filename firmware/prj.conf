# ExecuTorch runtime, selective operator build
CONFIG_EXECUTORCH=y
CONFIG_EXECUTORCH_BUILD_PORTABLE_OPS=n
CONFIG_EXECUTORCH_ENABLE_LOGGING=y

CONFIG_CPP=y
CONFIG_STD_CPP17=y

# Cortex-M0+: no FPU, fp32 in software. Keep stacks modest, the frame buffer
# and the method pool are the big consumers of the 264 KB.
CONFIG_MAIN_STACK_SIZE=12288
CONFIG_HEAP_MEM_POOL_SIZE=16384

CONFIG_REQUIRES_FLOAT_PRINTF=y
CONFIG_PRINTK=y
CONFIG_GPIO=y

# Console on USB CDC ACM (the Pico4ML has no UART-to-USB bridge)
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PID=0x0004
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Pico4ML ExecuTorch"
